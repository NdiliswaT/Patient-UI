<!DOCTYPE html>
<html>

<head>
  <title>Firestore Vanilla JS Fetch</title>
  <link rel="stylesheet" href="Style.css">
</head>

<body>
  <h1>Patients</h1>
  <input type="text" id="searchInput" placeholder="Search patient by name or surname..." />
  <ul id="data-list"></ul>

  <script>
    const projectId = "we-show-cars";
    const collection = "patients";

    // Firestore REST endpoint
    const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${collection}`;

    let allPatients = [];

    async function fetchData() {
      try {
        const res = await fetch(url);
        const data = await res.json();

        console.log(data);

        // Firestore returns an array under "documents"
        const list = document.getElementById("data-list");
        list.innerHTML = "";

        if (data.documents) {
          allPatients = data.documents.map(doc => {
            // Firestore stores fields in a structured format
            const fields = doc.fields;
            return {
              name: fields && fields.name ? fields.name.stringValue : "N/A",
              surname: fields && fields.surname ? fields.surname.stringValue : "N/A",
              address: fields && fields.address ? fields.address.stringValue : "N/A",
              dateOfBirth: fields && fields.dateOfBirth ? fields.dateOfBirth.stringValue : "N/A",
              email: fields && fields.email ? fields.email.stringValue : "N/A",
              phone: fields && fields.phone ? fields.phone.stringValue : "N/A",
            };
          });

          renderPatients(allPatients);
        } else {
          list.innerHTML = "<li>No patient records found.</li>";
        }

      } catch (err) {
        console.error("Error fetching Firestore data:", err);
      }
    }

    function renderPatients(patients) {
      const list = document.getElementById("data-list");
      list.innerHTML = "";

      if (patients.length === 0) {
        list.innerHTML = "<li>No matching patients found.</li>";
        return;
      }

      patients.forEach(p => {
        const li = document.createElement("li");
        li.innerHTML = `
              <p><strong>Name:</strong> ${p.name}</p>
<p><strong>Surname:</strong> ${p.surname}</p>
<p><strong>Date of Birth:</strong> ${p.dateOfBirth}</p>
<p><strong>Email:</strong> ${p.email}</p>
<p><strong>Phone:</strong> ${p.phone}</p>
<p><strong>Address:</strong> ${p.address}</p>
            `;
        list.appendChild(li);
      });
    }

    // Search as you type
    document.addEventListener("input", (e) => {
      if (e.target.id === "searchInput") {
        const value = e.target.value.toLowerCase();
        const filtered = allPatients.filter(p =>
          p.name.toLowerCase().includes(value) ||
              p.surname.toLowerCase().includes(value)
        );
        renderPatients(filtered);
      }
    });

    fetchData();
  </script>
</body>

</html>
